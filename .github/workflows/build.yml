name: build
permissions:
  contents: write

env:
 BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      release:
        type: boolean
        default: false
        description: Whether to make a release
  pull_request:
  push:
    paths-ignore:
      - "README.md"
      - ".gitignore"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: VERSION file changed
        id: version-file-changed
        uses: tj-actions/changed-files@v42
        with:
          files: VERSION

      - name: Should make release?
        if: |
          github.ref == 'refs/heads/main' && 
            ((github.event.inputs.release && github.event_name == 'workflow_dispatch') ||
              (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.version-file-changed.outputs.any_changed == 'true'))
        run: echo make_release=true >> "$GITHUB_ENV"

      - name: Get version
        if: env.make_release
        run: echo VERSION="$(head VERSION)" >> "$GITHUB_ENV"

      - name: Gradle Build and Test
        run: |
          ./gradlew build test --info --stacktrace

      - name: Release (GitHub)
        if: env.make_release
        id: github_release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ env.VERSION }}
          tag_name: ${{ env.VERSION }}

      - name: Verify Maven Central secrets
        if: env.make_release
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          for secret_name in \
            MAVEN_CENTRAL_USERNAME \
            MAVEN_CENTRAL_PASSWORD \
            SIGNING_PRIVATE_KEY \
            SIGNING_PASSWORD; do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Missing required secret: $secret_name"
              exit 1
            fi
          done

      - name: Publish to Maven Central
        if: env.make_release
        run: |
          ./gradlew :services-geojson:publishToSonatype :services-turf:publishToSonatype --info --stacktrace \
            -PsonatypeMavenCentralUser="${MAVEN_CENTRAL_USERNAME}" \
            -PsonatypeMavenCentralPassword="${MAVEN_CENTRAL_PASSWORD}" \
            -PsonatypeSigningKey="${SIGNING_PRIVATE_KEY}" \
            -PsonatypeSigningSecret="${SIGNING_PASSWORD}"
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
